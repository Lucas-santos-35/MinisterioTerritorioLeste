    <script>
        let currentUser = { id: 'jv', name: 'João Vitor', role: 'admin' };
        let territories = [];
        let conductors = [];
        let selectedTerritoryNumber = null;
        let selectedConductorId = null;
        let currentNeighborhoodFilter = null;
        let territoriesVisible = false;
        let currentCardGalleryFilter = null;
        let selectedGalleryCards = [];

        // ==================== ARMAZENAMENTO DE ALTA CAPACIDADE (INDEXEDDB) ====================
        // O localStorage tem limite de apenas ~5MB, o que impede salvar 73 fotos/PDFs.
        // O IndexedDB suporta centenas de megabytes e garante o salvamento de todos os 73 cartões.
        const IDB_NAME = 'TerritoriosBH_DB';
        const IDB_STORE = 'app_state';
        let idbInstance = null;

        function openTerritoriesDB() {
            return new Promise((resolve, reject) => {
                if (idbInstance) {
                    resolve(idbInstance);
                    return;
                }
                const req = indexedDB.open(IDB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(IDB_STORE)) {
                        db.createObjectStore(IDB_STORE);
                    }
                };
                req.onsuccess = (e) => {
                    idbInstance = e.target.result;
                    resolve(idbInstance);
                };
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function idbSet(key, val) {
            try {
                const db = await openTerritoriesDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readwrite');
                    tx.objectStore(IDB_STORE).put(val, key);
                    tx.oncomplete = () => resolve(true);
                    tx.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error("Erro ao gravar no IndexedDB:", err);
                return false;
            }
        }

        async function idbGet(key) {
            try {
                const db = await openTerritoriesDB();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(IDB_STORE, 'readonly');
                    const req = tx.objectStore(IDB_STORE).get(key);
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = (e) => reject(e.target.error);
                });
            } catch (err) {
                console.error("Erro ao ler do IndexedDB:", err);
                return null;
            }
        }

        window.getTerritoriesState = () => territories;
        window.getConductorsState = () => conductors;
        window.setTerritoriesFromCloud = async (data) => {
            territories = Array.isArray(data) ? data : [];
            await idbSet('jw_territories_data', territories);
            try { localStorage.setItem('jw_territories_data', JSON.stringify(territories)); } catch (e) {}
        };
        window.setConductorsFromCloud = async (data) => {
            conductors = Array.isArray(data) ? data : [];
            await idbSet('jw_conductors_data', conductors);
            try { localStorage.setItem('jw_conductors_data', JSON.stringify(conductors)); } catch (e) {}
        };

        async function saveStorage() {
            try {
                // Salva no IndexedDB (sem limite de 5MB - comporta os 73 cartões com fotos/PDFs)
                await idbSet('jw_territories_data', territories);
                await idbSet('jw_conductors_data', conductors);

                // Mantém espelho no localStorage se couber (fallback leve sem arquivos pesados caso ultrapasse 5MB)
                try {
                    localStorage.setItem('jw_territories_data', JSON.stringify(territories));
                    localStorage.setItem('jw_conductors_data', JSON.stringify(conductors));
                } catch (lsErr) {
                    const lightTerritories = territories.map(t => ({ ...t, fileData: '' }));
                    try {
                        localStorage.setItem('jw_territories_data', JSON.stringify(lightTerritories));
                        localStorage.setItem('jw_conductors_data', JSON.stringify(conductors));
                    } catch (e2) {}
                }

                if (typeof window.broadcastP2PState === 'function') {
                    window.broadcastP2PState();
                }
                if (typeof window.pushDataToCloud === 'function') {
                    window.pushDataToCloud();
                }
            } catch (e) {
                console.error("Erro ao salvar dados:", e);
                showToast("Erro ao salvar no aparelho. Tente novamente.");
            }
        }

        async function loadStorage() {
            try {
                // Prioriza o IndexedDB de alta capacidade
                const idbT = await idbGet('jw_territories_data');
                const idbC = await idbGet('jw_conductors_data');

                if (Array.isArray(idbT) && idbT.length > 0) {
                    territories = idbT;
                } else {
                    const storedT = localStorage.getItem('jw_territories_data');
                    territories = storedT ? JSON.parse(storedT) : [];
                    if (territories.length > 0) await idbSet('jw_territories_data', territories);
                }

                if (Array.isArray(idbC) && idbC.length > 0) {
                    conductors = idbC;
                } else {
                    const storedC = localStorage.getItem('jw_conductors_data');
                    conductors = storedC ? JSON.parse(storedC) : [];
                    if (conductors.length > 0) await idbSet('jw_conductors_data', conductors);
                }
            } catch (e) {
                console.error("Erro ao carregar dados:", e);
                territories = [];
                conductors = [];
            }
        }

        function processUploadedFile(file, callback) {
            if (!file) return;
            if (file.type.includes('pdf')) {
                const reader = new FileReader();
                reader.onload = (evt) => callback(evt.target.result, 'pdf', file.name);
                reader.onerror = () => showToast("Erro ao ler o arquivo PDF.");
                reader.readAsDataURL(file);
                return;
            }
            const reader = new FileReader();
            reader.onload = (evt) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    // Resolução ideal para leitura nítida das ruas e leveza para 73 cartões
                    const maxDim = 960;
                    let w = img.width;
                    let h = img.height;
                    if (w > maxDim || h > maxDim) {
                        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
                        else { w = Math.round((w * maxDim) / h); h = maxDim; }
                    }
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);
                    callback(canvas.toDataURL('image/jpeg', 0.68), 'image', file.name);
                };
                img.onerror = () => callback(evt.target.result, 'image', file.name);
                img.src = evt.target.result;
            };
            reader.onerror = () => showToast("Erro ao ler a imagem selecionada.");
            reader.readAsDataURL(file);
        }

        function handlePuzzleMapUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            if (file.type.includes('pdf')) {
                showToast("Para fundo do quebra-cabeça, envie uma captura de tela (imagem JPG/PNG) do mapa.");
                return;
            }
            processUploadedFile(file, async (dataUrl) => {
                try {
                    await idbSet('jw_puzzle_bg_map', dataUrl);
                    try { localStorage.setItem('jw_puzzle_bg_map', dataUrl); } catch (lsErr) {}
                    await renderPuzzleMap();
                    showToast("Mapa de fundo atualizado!");
                } catch (err) {
                    showToast("Erro ao salvar mapa de fundo.");
                }
            });
        }

        async function handlePuzzlePieceClick(code, neighborhood) {
            let match = findMatchingTerritory(code);
            if (!match) {
                match = {
                    number: code,
                    neighborhood: neighborhood,
                    streets: '',
                    status: 'disponivel',
                    lastWorked: null,
                    lastConductor: 'Nenhum',
                    lastResult: 'Inédito',
                    fileData: '',
                    fileType: 'image',
                    fileName: '',
                    history: []
                };
                territories.push(match);
                await saveStorage();
                refreshAllViews();
                showToast(`Cartão ${code} criado automaticamente!`);
            }
            openTerritoryModal(match.number);
        }

        async function renderPuzzleMap() {
            const layer = document.getElementById('puzzle-pieces-layer');
            if (!layer) return;

            const savedBg = (await idbGet('jw_puzzle_bg_map')) || localStorage.getItem('jw_puzzle_bg_map');
            const bgImg = document.getElementById('puzzle-bg-image');
            if (bgImg) {
                if (savedBg) {
                    bgImg.src = savedBg;
                    bgImg.classList.remove('hidden');
                } else {
                    bgImg.classList.add('hidden');
                }
            }

        function openPhotoChangePrompt() {
            const t = territories.find(item => item.number === selectedTerritoryNumber);
            if (!t) return;

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'image/*,.pdf';
            fileInput.onchange = function(e) {
                const file = e.target.files[0];
                if (file) {
                    showToast("Processando e salvando arquivo...");
                    processUploadedFile(file, async (dataUrl, type, name) => {
                        t.fileData = dataUrl;
                        t.fileType = type;
                        t.fileName = name;
                        await saveStorage();
                        openTerritoryModal(t.number);
                        showToast("Arquivo salvo permanentemente!");
                        refreshAllViews();
                    });
                }
            };
            fileInput.click();
        }

        function saveTerritoryEdit(e) {
            e.preventDefault();
            const num = document.getElementById('edit-t-number').value.trim();
            const neighborhood = document.getElementById('edit-t-neighborhood').value;
            const fileInput = document.getElementById('edit-t-file');

            const t = territories.find(item => item.number === selectedTerritoryNumber);
            if (t) {
                t.number = num;
                t.neighborhood = neighborhood;

                if (fileInput.files && fileInput.files[0]) {
                    showToast("Salvando foto/PDF do cartão...");
                    processUploadedFile(fileInput.files[0], async (dataUrl, type, name) => {
                        t.fileData = dataUrl;
                        t.fileType = type;
                        t.fileName = name;
                        await saveStorage();
                        closeModal('modal-edit-territory');
                        showToast("Cartão e arquivo salvos com sucesso!");
                        refreshAllViews();
                    });
                } else {
                    saveStorage().then(() => {
                        closeModal('modal-edit-territory');
                        showToast("Território atualizado!");
                        refreshAllViews();
                    });
                }
            }
        }

        function saveNewTerritory(e) {
            e.preventDefault();
            const num = document.getElementById('new-t-number').value.trim();
            const neighborhood = document.getElementById('new-t-neighborhood').value;
            const fileInput = document.getElementById('new-t-file');

            if (territories.some(t => t.number.toLowerCase() === num.toLowerCase())) {
                showToast(`Já existe o território ${num}!`);
                return;
            }

            const defaultImg = 'https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?w=600&auto=format&fit=crop&q=60';

            if (fileInput.files && fileInput.files[0]) {
                showToast("Processando e salvando cartão...");
                processUploadedFile(fileInput.files[0], async (dataUrl, type, name) => {
                    territories.push({
                        number: num,
                        neighborhood: neighborhood,
                        streets: '',
                        status: 'disponivel',
                        lastWorked: null,
                        lastConductor: 'Nenhum',
                        lastResult: 'Inédito',
                        fileData: dataUrl,
                        fileType: type,
                        fileName: name,
                        history: []
                    });
                    await saveStorage();
                    closeModal('modal-new-territory');
                    refreshAllViews();
                    showToast(`Cartão ${num} salvo com sucesso (${territories.length} no total)!`);
                });
            } else {
                territories.push({
                    number: num,
                    neighborhood: neighborhood,
                    streets: '',
                    status: 'disponivel',
                    lastWorked: null,
                    lastConductor: 'Nenhum',
                    lastResult: 'Inédito',
                    fileData: defaultImg,
                    fileType: 'image',
                    fileName: 'cartao_padrao.jpg',
                    history: []
                });
                saveStorage().then(() => {
                    closeModal('modal-new-territory');
                    refreshAllViews();
                    showToast(`Cartão ${num} cadastrado!`);
                });
            }
        }
